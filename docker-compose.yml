name: os-project

services:
  backend1: &backend
    build: ./backend
    image: proyecto-final-backend:1.0
    container_name: backend1
    environment:
      INSTANCE: "backend1"
    networks: [infra]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend2:
    <<: *backend
    container_name: backend2
    environment:
      INSTANCE: "backend2"

  backend3:
    <<: *backend
    container_name: backend3
    environment:
      INSTANCE: "backend3"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }
    networks: [infra]
    restart: unless-stopped

  # Exportador: convierte el stub_status de Nginx en métricas para Prometheus
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks: [infra]
    restart: unless-stopped

  # cAdvisor: uso de CPU, memoria, red y disco de cada contenedor
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [infra]
    restart: unless-stopped

  # Prometheus: recolecta las métricas de backends, exportador y cAdvisor
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend1
      - backend2
      - backend3
      - nginx-exporter
      - cadvisor
    networks: [infra]
    restart: unless-stopped

  # Grafana: dashboards con los datos de Prometheus
  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/infraestructura.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks: [infra]
    restart: unless-stopped

networks:
  infra:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
