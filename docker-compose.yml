name: os-project

services:
  # TODO: backend1, backend2, backend3 (mismo build: ./backend, distinto INSTANCE)
  # Proxy inverso y balanceador de carga
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"   # único punto de entrada público
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - infra
    restart: unless-stopped

  # TODO: nginx-exporter (lee el stub_status de nginx)
  # TODO: prometheus (puerto 9090, monta prometheus/prometheus.yml, volumen prometheus_data)
  # TODO: cadvisor
  # TODO: grafana (puerto 3000, volumen grafana_data, monta grafana/provisioning)

networks:
  infra:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
