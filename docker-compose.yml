name: os-project

services:
  backend1: &backend
    build: ./backend
    image: proyecto-final-backend:1.0
    container_name: backend1
    environment:
      INSTANCE: "backend1"
    networks: [infra]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend2:
    <<: *backend
    container_name: backend2
    environment:
      INSTANCE: "backend2"

  backend3:
    <<: *backend
    container_name: backend3
    environment:
      INSTANCE: "backend3"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }
    networks: [infra]
    restart: unless-stopped
    
networks:
  infra:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
