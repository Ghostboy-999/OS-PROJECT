# Formato de log: muestra a qué backend se envió cada petición y cuánto tardó
log_format balanceo '$remote_addr -> upstream=$upstream_addr "$request" '
                    'status=$status tiempo=$request_time s';

# Grupo de backends. Los nombres son los servicios de docker-compose.yml;
# Docker los resuelve a la IP de cada contenedor en la red "infra".
# Sin algoritmo declarado, Nginx usa Round Robin.
upstream backends {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
}

# Proxy inverso: el único punto de entrada público (puerto 80, publicado como 8080)
server {
    listen 80;
    access_log /dev/stdout balanceo;

    location / {
        proxy_pass http://backends;

        # Cabeceras para que el backend conozca al cliente real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tolerancia a fallos: si un backend no responde, se intenta con el siguiente
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;

        # Cabecera de depuración: IP:puerto del backend que atendió
        add_header X-Upstream $upstream_addr always;
    }
}

# Servidor interno para métricas de Nginx (stub_status).
# El puerto 8081 NO se publica en docker-compose.yml: solo lo alcanza
# nginx-exporter dentro de la red de Docker.
server {
    listen 8081;
    access_log off;

    location /stub_status {
        stub_status;
    }
}
